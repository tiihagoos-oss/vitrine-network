
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Vitrine Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a href="/" class="logo">Vitrine<span>Network</span></a>
    <h1>Bem-vindo de volta!</h1>
    <p>Acesse sua conta para administrar sua vitrine.</p>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required
             placeholder="seu@email.com">

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required
             placeholder="Sua senha">

      <button class="btn-primary auth-button" type="submit">
        Entrar na minha conta
      </button>
      <div id="mensagem" class="auth-message" role="status"></div>
    </form>

    <p class="auth-footer">
      Ainda não tem conta? <a href="/cadastro.html">Cadastre-se</a>
    </p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
