
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | Vitrine Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a href="/" class="logo">Vitrine<span>Network</span></a>
    <h1>Crie sua vitrine</h1>
    <p>Cadastre-se e participe da nossa rede de vendedores.</p>

    <form id="registerForm">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" required maxlength="100"
             placeholder="Seu nome">

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required
             maxlength="254" placeholder="seu@email.com">

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required
             minlength="10" maxlength="128"
             placeholder="Mínimo de 10 caracteres">

      <button class="btn-primary auth-button" type="submit">
        Criar minha conta
      </button>
      <div id="mensagem" class="auth-message" role="status"></div>
    </form>

    <p class="auth-footer">
      Já tem uma conta? <a href="/login.html">Entrar</a>
    </p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
