
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine | Vitrine Network</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .public-vitrine {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    .public-header {
      text-align: center;
      padding: 45px 20px;
      background: #172d4b;
      color: white;
      border-radius: 16px;
      margin-bottom: 35px;
    }

    .public-header h1 {
      margin: 12px 0;
    }

    .public-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin: 25px 0 45px;
    }

    .public-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .public-card img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      border-radius: 8px;
    }

    .public-card h3 {
      margin: 12px 0 6px;
    }

    .public-card p {
      color: #666;
      font-size: 14px;
    }

    .public-card a {
      display: block;
      text-align: center;
      background: #1769e0;
      color: white;
      padding: 11px;
      border-radius: 7px;
      text-decoration: none;
      margin-top: 12px;
    }

    .partner-label {
      font-size: 12px;
      color: #168451;
      font-weight: bold;
    }

    .error-message {
      text-align: center;
      padding: 50px 15px;
    }
  </style>
</head>
<body>

<main class="public-vitrine">

  <header class="public-header">
    <a href="/" class="logo">Vitrine<span>Network</span></a>
    <h1 id="sellerName">Carregando vitrine...</h1>
    <p>Confira meus produtos e ofertas!</p>
  </header>

  <section>
    <h2>Meus produtos</h2>
    <div id="myProducts" class="public-grid">
      Carregando produtos...
    </div>
  </section>

  <section>
    <h2>Publicidade compartilhada</h2>
    <p>Conheça também os produtos de outros vendedores da nossa rede.</p>
    <div id="partnerProducts" class="public-grid">
      Carregando parceiros...
    </div>
  </section>

</main>

<script src="/vitrine-publica.js"></script>
</body>
</html>
